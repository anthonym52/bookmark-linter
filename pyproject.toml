[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmarklint"
version = "0.1.0"
description = "A linter for exported browser bookmark files"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "anthonym52" }]
keywords = ["bookmarks", "linter", "html", "netscape-bookmark-file"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/anthonym52/bookmark-linter"
Issues = "https://github.com/anthonym52/bookmark-linter/issues"

[project.scripts]
bookmarklint = "bookmarklint.cli:main"

[tool.setuptools.packages.find]
include = ["bookmarklint*"]
