[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmarklint"
version = "0.1.0"
description = "A linter for exported browser bookmark files"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "anthonym52" }]
dependencies = []

[project.scripts]
bookmarklint = "bookmarklint.cli:main"

[tool.setuptools.packages.find]
include = ["bookmarklint*"]
